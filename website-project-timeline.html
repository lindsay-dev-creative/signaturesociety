  return '<select id="'+id+'" class="ca-author name-select">'+nameOptionsHTML((selected||"").trim(), placeholder)+'</select>';
}
function authorSelectHTML(){ return nameSelectHTML("cAuthor", commentAuthor, "Select your name"); }
function bindNameSelects(){
  Array.prototype.forEach.call(document.querySelectorAll(".name-select"), function(sel){
    if(sel._nameBound) return; sel._nameBound=true;
    sel.addEventListener("mousedown", function(){ sel._prev = sel.value; });
    sel.addEventListener("change", function(){
      if(sel.value!=="__add__") return;
      var name = window.prompt("Add a name to the list:");
      name = name ? name.trim() : "";
      if(!name){ sel.value = sel._prev || ""; return; }
      addNameOption(name);
      Array.prototype.forEach.call(document.querySelectorAll(".name-select"), function(s){
        var cur = (s===sel) ? name : (s.value==="__add__" ? (s._prev||"") : s.value);
        s.innerHTML = nameOptionsHTML(cur, phForSelect(s.id));
      });
    });
  });
}
function businessDaysInclusive(a,b){
  if(b<a) return 1;
  var d=new Date(a.getFullYear(),a.getMonth(),a.getDate()), end=new Date(b.getFullYear(),b.getMonth(),b.getDate()), n=0;
  while(d<=end){ var g=d.getDay(); if(g!==0&&g!==6) n++; d.setDate(d.getDate()+1); }
  return Math.max(1,n);
}
function saveEdit(){
  var t=byId[editingId]; if(!t) return;
  t.name=document.getElementById("fName").value.trim()||t.name;
  var fd=document.getElementById("fDesc"); if(fd) t.description=fd.value;
  var avSel=document.getElementById("fAssignee");
  if(avSel && avSel.value!=="__add__") setAssignee(t, avSel.value.trim());
  clearMemo(); save(); rerender(); closeEditor();
}
function showDrawer(){
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer").setAttribute("aria-hidden","false");
  document.getElementById("scrim").classList.add("open");
}
function closeEditor(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawer").setAttribute("aria-hidden","true");
  document.getElementById("scrim").classList.remove("open");
  editingId=null;
}

/* ============ BINDINGS ============ */
function bindBars(){
  // Single delegated listener on the persistent #calArea container. Survives re-renders and
  // reliably catches clicks on any bar (label, glyph, or a segment that spans week boundaries).
  var area=document.getElementById("calArea");
  if(!area || area._barDelegated) return;
  area._barDelegated=true;
  area.addEventListener("click",function(e){
    var el=e.target.closest("[data-id]");
    if(el && area.contains(el) && el.getAttribute("data-id")) openEditor(el.getAttribute("data-id"));
  });
}
function bindRows(){
  Array.prototype.forEach.call(document.querySelectorAll(".tbl tr[data-id]"),function(tr){
    tr.onclick=function(e){
      if(e.target.closest(".row-complete")||e.target.closest(".comment-btn")||e.target.closest(".delete-btn")||e.target.closest(".row-assignee")||e.target.closest(".row-status")) return;
      openEditor(tr.getAttribute("data-id"));
    };
  });
}
function bindCompleteBoxes(){
  Array.prototype.forEach.call(document.querySelectorAll(".row-complete"),function(cb){
    cb.onclick=function(e){ e.stopPropagation(); };
    cb.onchange=function(){
      var t=byId[cb.getAttribute("data-complete")]; if(!t) return;
      t.complete=cb.checked; save();
      var tr=cb.closest("tr"); if(tr) tr.classList.toggle("completed", cb.checked);
    };
  });
}
function bindCommentBtns(){
  Array.prototype.forEach.call(document.querySelectorAll(".comment-btn"),function(b){
    b.onclick=function(e){ e.stopPropagation(); openEditor(b.getAttribute("data-comment"), true); };
  });
}
function bindDeleteBtns(){
  Array.prototype.forEach.call(document.querySelectorAll(".delete-btn"),function(b){
    b.onclick=function(e){ e.stopPropagation(); confirmDelete(b.getAttribute("data-delete")); };
  });
}
function confirmDelete(id){
  var t=byId[id]; if(!t) return;
  if(!confirm("Are you sure you want to delete this phase?")) return;
  deleteTask(id);
}
function deleteTask(id){
  if(!state.removed) state.removed=[];
  if(state.removed.indexOf(id)===-1) state.removed.push(id);   // so mergeNewTasks() doesn't bring it back
  state.tasks = state.tasks.filter(function(t){return t.id!==id;});
  // drop the deleted id from any remaining dependency chains
  state.tasks.forEach(function(t){ if(t.after && t.after.length) t.after = t.after.filter(function(a){return a!==id;}); });
  if(editingId===id) closeEditor();
  clearMemo(); reindexIfNeeded(); save(); rerender();
}

/* ============ RERENDER ============ */
function rerender(){
  reindexIfNeeded();
  renderLaunch();
  var timeline = (view==="timeline");
  // prev/next/today only make sense for the paged month & week views
  ["prevBtn","nextBtn","todayBtn"].forEach(function(id){
    var el=document.getElementById(id); if(el) el.style.display = timeline ? "none" : "";
  });
  if(view==="month") renderMonth();
  else if(view==="week") renderWeek();
  else renderOverview();
  renderList();
}
function reindexIfNeeded(){ byId={}; state.tasks.forEach(function(t){byId[t.id]=t;}); }

/* ============ UTIL ============ */
function esc(s){s=(s==null?"":""+s);return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function escAttr(s){return esc(s).replace(/"/g,"&quot;");}

/* ============ EVENTS ============ */
document.getElementById("segmented").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return;
  view=b.getAttribute("data-view");
  if(view==="week"){ cursor=new Date(); }   // always open on the current week
  Array.prototype.forEach.call(this.children,function(c){c.classList.toggle("active",c===b);});
  rerender();
});
document.getElementById("prevBtn").onclick=function(){step(-1);};
document.getElementById("nextBtn").onclick=function(){step(1);};
function step(dir){
  if(view==="month"){ cursor=new Date(cursor.getFullYear(),cursor.getMonth()+dir,1); }
  else{ cursor=new Date(cursor.getFullYear(),cursor.getMonth(),cursor.getDate()+7*dir); }
  rerender();
}
document.getElementById("todayBtn").onclick=function(){
  var t=new Date();
  cursor = view==="month" ? new Date(t.getFullYear(),t.getMonth(),1) : t;
  rerender();
};
var resetBtn=document.getElementById("resetBtn");
if(resetBtn) resetBtn.onclick=function(){
  if(!confirm("Reset the schedule back to the original dates?\n\nThis also clears every comment, uploaded file, and link on every phase. Message board posts are kept. This cannot be undone.")) return;
  try{localStorage.removeItem(STORE_KEY);}catch(e){}
  state=freshState();
  reindexIfNeeded(); clearMemo();
  cursor=new Date(parseISO(state.start).getFullYear(),parseISO(state.start).getMonth(),1);
  rerender();
};
document.getElementById("drawerClose").onclick=closeEditor;
document.getElementById("scrim").onclick=closeEditor;
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  if(document.getElementById("previewModal").classList.contains("open")) closePreview();
  else if(document.getElementById("noteModal").classList.contains("open")) closeNote();
  else if(document.getElementById("notesModal").classList.contains("open")) closeNotes();
  else if(document.getElementById("boardModal").classList.contains("open")) closeBoard();
  else closeEditor();
});
document.getElementById("previewClose").onclick=closePreview;
document.getElementById("previewScrim").onclick=closePreview;

/* ============ POST BOARDS (Message Board + Website Suggestions) ============ */
/* Each board lives in its own localStorage key so it survives a schedule reset
   or a STORE_KEY bump, and the two share one modal. */
function readStore(key){
  try{ var raw=localStorage.getItem(key); if(raw){ var a=JSON.parse(raw); if(a instanceof Array) return a; } }catch(e){}
  return [];
}
function writeStore(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ alert("This browser's storage is full, so that could not be saved and would be lost when you close the page."); return false; }
}
var POST_BOARDS={
  messages:{title:"Message Board", key:"ss_message_board_v1",
            empty:"No messages yet. Post the first one below.",
            placeholder:"Write a message for the team...", cta:"Post message"},
  suggestions:{title:"Project Website Suggestions", key:"ss_suggestions_v1",
            empty:"No suggestions yet. Add the first one below.",
            placeholder:"Share a suggestion for the website...", cta:"Add suggestion"}
};
var activeBoard=null;      // one of POST_BOARDS
var BOARD=[];              // the active board's items
var editingMsgId=null;
function saveBoard(){ return activeBoard ? writeStore(activeBoard.key, BOARD) : false; }
function boardAuthor(){
  var s=document.getElementById("bAuthor");
  var v=s && s.value && s.value!=="__add__" ? s.value.trim() : "";
  return v || commentAuthor || "";
}
function renderBoard(){
  var list=document.getElementById("boardList"); if(!list || !activeBoard) return;
  var me=boardAuthor();
  if(!BOARD.length){
    list.innerHTML='<div class="board-empty">'+esc(activeBoard.empty)+'</div>';
  }else{
    list.innerHTML = BOARD.map(function(m){
      if(m.id===editingMsgId){
        return '<div class="board-msg"><div class="bm-head"><span class="bm-author">'+esc(m.author)+'</span><span class="bm-when">'+esc(m.when||"")+'</span></div>'+
          '<div class="bm-edit"><textarea id="bEditText">'+esc(m.text)+'</textarea>'+
            '<div class="bm-actions"><button type="button" class="btn-inline on-dark md" data-savemsg="'+escAttr(m.id)+'">Save</button>'+
              '<button type="button" class="btn-inline on-dark md" data-cancelmsg="1">Cancel</button></div>'+
          '</div></div>';
      }
      var mine = me && m.author===me;
      return '<div class="board-msg">'+
        '<div class="bm-head"><span class="bm-author">'+esc(m.author)+'</span>'+
          '<span class="bm-when">'+esc(m.when||"")+(m.edited?'<span class="bm-edited">edited '+esc(m.edited)+'</span>':'')+'</span></div>'+
        '<div class="bm-text">'+esc(m.text)+'</div>'+
        (mine?'<div class="bm-actions"><button type="button" class="bm-act" data-editmsg="'+escAttr(m.id)+'">EDIT</button>'+
              '<button type="button" class="bm-act del" data-delmsg="'+escAttr(m.id)+'">DELETE</button></div>':'')+
      '</div>';
    }).join("");
  }
  Array.prototype.forEach.call(list.querySelectorAll("[data-editmsg]"),function(b){
    b.onclick=function(){ editingMsgId=b.getAttribute("data-editmsg"); renderBoard(); var ta=document.getElementById("bEditText"); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); } };
  });
  Array.prototype.forEach.call(list.querySelectorAll("[data-delmsg]"),function(b){
    b.onclick=function(){ deleteMessage(b.getAttribute("data-delmsg")); };
  });
  Array.prototype.forEach.call(list.querySelectorAll("[data-savemsg]"),function(b){
    b.onclick=function(){ saveMessageEdit(b.getAttribute("data-savemsg")); };
  });
  Array.prototype.forEach.call(list.querySelectorAll("[data-cancelmsg]"),function(b){
    b.onclick=function(){ editingMsgId=null; renderBoard(); };
  });
}
function postMessage(){
  var ta=document.getElementById("bText");
  var author=boardAuthor();
  if(!author){ alert("Please select your name before posting."); var s=document.getElementById("bAuthor"); if(s) s.focus(); return; }
  var text=(ta && ta.value || "").trim();
  if(!text){ alert("Please write something first."); if(ta) ta.focus(); return; }
  commentAuthor=author; try{localStorage.setItem("ss_comment_author",author);}catch(e){}
  BOARD.push({id:"m"+Date.now()+"-"+Math.round(Math.random()*1e6), author:author, text:text, when:commentStamp()});
  if(!saveBoard()){ BOARD.pop(); return; }
  ta.value="";
  editingMsgId=null;
  renderBoard();
  var list=document.getElementById("boardList"); if(list) list.scrollTop=list.scrollHeight;
}
function saveMessageEdit(id){
  var m=BOARD.filter(function(x){return x.id===id;})[0]; if(!m) return;
  if(m.author!==boardAuthor()){ alert("You can only edit your own posts."); return; }
  var ta=document.getElementById("bEditText");
  var text=(ta && ta.value || "").trim();
  if(!text){ alert("This cannot be empty. Delete it instead."); if(ta) ta.focus(); return; }
  var prev=m.text, prevEdited=m.edited;
  m.text=text; m.edited=commentStamp();
  if(!saveBoard()){ m.text=prev; m.edited=prevEdited; return; }
  editingMsgId=null;
  renderBoard();
}
function deleteMessage(id){
  var i=-1;
  for(var k=0;k<BOARD.length;k++){ if(BOARD[k].id===id){ i=k; break; } }
  if(i<0) return;
  if(BOARD[i].author!==boardAuthor()){ alert("You can only delete your own posts."); return; }
  if(!confirm("Delete this post?")) return;
  var gone=BOARD.splice(i,1)[0];
  if(!saveBoard()){ BOARD.splice(i,0,gone); return; }
  if(editingMsgId===id) editingMsgId=null;
  renderBoard();
}
function openBoard(kind){
  activeBoard=POST_BOARDS[kind]||POST_BOARDS.messages;
  BOARD=readStore(activeBoard.key);
  document.getElementById("boardTitle").textContent=activeBoard.title;
  var ta=document.getElementById("bText");
  ta.value=""; ta.setAttribute("placeholder", activeBoard.placeholder);
  var row=document.getElementById("boardAuthorRow");
  row.innerHTML = nameSelectHTML("bAuthor", commentAuthor, "Select your name")+
    '<button type="button" class="btn-inline on-dark md" id="bPostBtn">'+esc(activeBoard.cta)+'</button>';
  bindNameSelects();
  document.getElementById("bPostBtn").onclick=postMessage;
  // switching names re-evaluates which posts you can edit or delete
  document.getElementById("bAuthor").addEventListener("change",function(){ editingMsgId=null; renderBoard(); });
  editingMsgId=null;
  renderBoard();
  document.getElementById("boardScrim").classList.add("open");
  var mo=document.getElementById("boardModal");
  mo.classList.add("open"); mo.setAttribute("aria-hidden","false");
  var list=document.getElementById("boardList"); if(list) list.scrollTop=list.scrollHeight;
}
function closeBoard(){
  var mo=document.getElementById("boardModal");
  mo.classList.remove("open"); mo.setAttribute("aria-hidden","true");
  document.getElementById("boardScrim").classList.remove("open");
  editingMsgId=null;
}
document.getElementById("boardOpenBtn").onclick=function(){ openBoard("messages"); };
document.getElementById("suggestOpenBtn").onclick=function(){ openBoard("suggestions"); };
document.getElementById("boardClose").onclick=closeBoard;
document.getElementById("boardScrim").onclick=closeBoard;

/* ============ MEETING NOTES ============ */
var NOTES_KEY="ss_meeting_notes_v1";
var NOTES=readStore(NOTES_KEY);
var editingNoteId=null;      // null while the note modal is closed, "" for a brand new note
function saveNotes(){ return writeStore(NOTES_KEY, NOTES); }
function noteDateStamp(){
  var d=new Date();
  return MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
function notePreview(s){ s=(s||"").replace(/\s+/g," ").trim(); return s.length>120 ? s.slice(0,118)+"..." : s; }
function renderNotes(){
  var wrap=document.getElementById("notesList"); if(!wrap) return;
  if(!NOTES.length){
    wrap.innerHTML='<div class="board-empty">No meeting notes yet. Use "New meeting note" below.</div>';
    return;
  }
  var rows=NOTES.map(function(n){
    return '<tr data-note="'+escAttr(n.id)+'">'+
      '<td class="nt-date">'+esc(n.date||"")+'</td>'+
      '<td class="nt-text">'+esc(notePreview(n.text))+'</td>'+
      '<td class="nt-open"><span class="nt-chev">&rsaquo;</span></td>'+
    '</tr>';
  }).join("");
  wrap.innerHTML='<table class="notes-tbl"><thead><tr>'+
      '<th style="width:150px">Meeting Date</th><th>Notes</th><th style="width:40px"></th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table>';
  Array.prototype.forEach.call(wrap.querySelectorAll("tr[data-note]"),function(tr){
    tr.onclick=function(){ openNote(tr.getAttribute("data-note")); };
  });
}
function openNotes(){
  NOTES=readStore(NOTES_KEY);
  renderNotes();
  document.getElementById("notesScrim").classList.add("open");
  var mo=document.getElementById("notesModal");
  mo.classList.add("open"); mo.setAttribute("aria-hidden","false");
}
function closeNotes(){
  var mo=document.getElementById("notesModal");
  mo.classList.remove("open"); mo.setAttribute("aria-hidden","true");
  document.getElementById("notesScrim").classList.remove("open");
}
function openNote(id){
  var n = id ? NOTES.filter(function(x){return x.id===id;})[0] : null;
  editingNoteId = n ? n.id : "";
  document.getElementById("noteTitle").textContent = n ? "Meeting note" : "New meeting note";
  document.getElementById("noteDate").textContent = n ? n.date : noteDateStamp();
  document.getElementById("noteText").value = n ? n.text : "";
  document.getElementById("noteDeleteBtn").style.display = n ? "" : "none";
  document.getElementById("noteScrim").classList.add("open");
  var mo=document.getElementById("noteModal");
  mo.classList.add("open"); mo.setAttribute("aria-hidden","false");
  var ta=document.getElementById("noteText"); if(ta) ta.focus();
}
function closeNote(){
  var mo=document.getElementById("noteModal");
  mo.classList.remove("open"); mo.setAttribute("aria-hidden","true");
  document.getElementById("noteScrim").classList.remove("open");
  editingNoteId=null;
}
function saveNote(){
  var ta=document.getElementById("noteText");
  var text=(ta && ta.value || "").trim();
  if(!text){ alert("Please paste or type the notes first."); if(ta) ta.focus(); return; }
  if(editingNoteId){
    var n=NOTES.filter(function(x){return x.id===editingNoteId;})[0]; if(!n) return;
    var prev=n.text; n.text=text; n.edited=commentStamp();
    if(!saveNotes()){ n.text=prev; return; }
  }else{
    // Meeting Date is set automatically from the day the note is added
    var item={id:"n"+Date.now()+"-"+Math.round(Math.random()*1e6), date:noteDateStamp(), added:commentStamp(), text:text};
    NOTES.unshift(item);
    if(!saveNotes()){ NOTES.shift(); return; }
  }
  closeNote();
  renderNotes();
}
function deleteNote(){
  if(!editingNoteId) return;
  var i=-1;
  for(var k=0;k<NOTES.length;k++){ if(NOTES[k].id===editingNoteId){ i=k; break; } }
  if(i<0) return;
  if(!confirm("Delete this meeting note?")) return;
  var gone=NOTES.splice(i,1)[0];
  if(!saveNotes()){ NOTES.splice(i,0,gone); return; }
  closeNote();
  renderNotes();
}
document.getElementById("notesOpenBtn").onclick=openNotes;
document.getElementById("notesClose").onclick=closeNotes;
document.getElementById("notesScrim").onclick=closeNotes;
document.getElementById("noteNewBtn").onclick=function(){ openNote(null); };
document.getElementById("noteClose").onclick=closeNote;
document.getElementById("noteScrim").onclick=closeNote;
document.getElementById("noteCancelBtn").onclick=closeNote;
document.getElementById("noteSaveBtn").onclick=saveNote;
document.getElementById("noteDeleteBtn").onclick=deleteNote;
/* full-schedule collapse removed; each phase now has its own toggle */
isMobile.addEventListener?isMobile.addEventListener("change",rerender):isMobile.addListener(rerender);
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(rerender,150);});

/* ============ INIT ============ */
/* Phases added to ORIGINAL_DATA after someone already has saved state get folded in here,
   in their scheduled position, without touching that person's edits, comments, or files. */
function mergeNewTasks(){
  var have={}; state.tasks.forEach(function(t){ have[t.id]=true; });
  var removed=state.removed||[], added=0, at=0;
  ORIGINAL_DATA.forEach(function(o){
    if(have[o.id]){
      for(var i=0;i<state.tasks.length;i++){ if(state.tasks[i].id===o.id){ at=i+1; break; } }
      return;
    }
    if(removed.indexOf(o.id)!==-1) return;   // deliberately deleted, leave it out
    state.tasks.splice(at,0,JSON.parse(JSON.stringify(o)));
    at++; added++;
  });
  if(added) save();
}
mergeNewTasks();
reindexIfNeeded();
applySavedAssignees();
applySavedStatus();
rerender();
</script>
